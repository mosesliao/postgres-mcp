services:
  traefik:
    image: traefik:v3.0
    restart: unless-stopped
    command:
      - "--entrypoints.web.address=:80"
      - "--providers.file.filename=/traefik/config.yaml"
      - "--providers.file.watch=true"
    ports:
      - "80:80"
    volumes:
      - ./traefik-config.yaml:/traefik/config.yaml:ro

  db:
    build: ./docker/postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: northwind
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d northwind"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  mcp:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:[REDACTED]@db:5432/northwind
      MCP_TRANSPORT: streamable-http
      MCP_PORT: 8000
      MCP_HOST: "0.0.0.0"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.create_connection(('localhost',8000),timeout=3); s.close()\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  jupyter:
    image: jupyter/scipy-notebook:latest
    restart: unless-stopped
    environment:
      JUPYTER_TOKEN: "open-webui"
    ports:
      - "8888:8888"

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.open-webui.rule=Host(`openwebui.localhost`)"
      - "traefik.http.routers.open-webui.entrypoints=web"
      - "traefik.http.services.open-webui.loadbalancer.server.port=8080"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      ENABLE_OLLAMA_API: "true"
      ENABLE_OPENAI_API: "false"
      # The first account created is always allowed through and becomes admin.
      ENABLE_SIGNUP: "false"
      CODE_EXECUTION_JUPYTER_URL: "http://jupyter:8888"
      CODE_EXECUTION_JUPYTER_TOKEN: "open-webui"
      TOOL_SERVER_CONNECTIONS: '[{"url":"http://mcp:8000/mcp","path":"openapi.json","type":"mcp","auth_type":"bearer","headers":null,"key":"","config":{"enable":true,"function_name_filter_list":"","access_grants":[]},"info":{"id":"1","name":"postgres-mcp","description":"Northwind PostgreSQL MCP"},"spec_type":"url","spec":""}]'
    volumes:
      - open-webui:/app/backend/data
      - ./webui-init.py:/app/backend/webui-init.py
    depends_on:
      mcp:
        condition: service_healthy

volumes:
  pgdata:
  open-webui:
