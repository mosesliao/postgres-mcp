name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint tools
        run: pip install ruff black mypy psycopg2-binary python-dotenv

      - name: Ruff (style + correctness)
        run: ruff check .

      - name: Black (formatting)
        run: black --check .

      - name: Mypy (type safety)
        run: mypy server.py --ignore-missing-imports

  test:
    name: BDD tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: northwind
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/northwind

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[test]"

      - name: Load Northwind schema
        run: |
          curl -fsSL https://raw.githubusercontent.com/pthom/northwind_psql/master/northwind.sql \
            -o /tmp/northwind.sql
          psql "$DATABASE_URL" -f /tmp/northwind.sql

      - name: Run BDD tests
        run: pytest tests/ -v --tb=short
