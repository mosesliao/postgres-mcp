[project]
name = "postgres-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
]

[project.scripts]
postgres-mcp = "server:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-bdd>=7.0",
    "pytest-mock>=3.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "S",   # bandit-style security rules
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "S101",  # assert statements are fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]  # assert in tests

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
